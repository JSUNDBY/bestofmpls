name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Refresh scraped events, weather, and horoscope four times a day so the
  # "Tonight" page and the calendar never sit on stale data for more than
  # six hours. 11 UTC (6 AM CT), 17 UTC (noon CT), 23 UTC (6 PM CT),
  # 5 UTC (midnight CT — catches the day rollover for /tonight/).
  schedule:
    - cron: '5 5,11,17,23 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping queued runs in between.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Scrape events
        run: node scripts/scrape-events.js
        continue-on-error: true

      - name: Generate horoscope
        run: node scripts/build-horoscope.js

      - name: Generate right-now (sun + weather + countdowns)
        run: node scripts/build-rightnow.js
        continue-on-error: true

      - name: Score the Living Best of (reads worker signals)
        run: node scripts/livingbest.js
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Send weekly newsletter (Mondays only)
        if: github.event_name == 'schedule' && startsWith(github.event.schedule, '5 5') && startsWith(toJSON(github.event), '{}')
        run: |
          DAY=$(date -u +%u)
          if [ "$DAY" = "1" ]; then
            echo "Monday — sending newsletter"
            node scripts/send-newsletter.js
          else
            echo "Not Monday (day $DAY) — skipping"
          fi
        env:
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUB_ID: pub_c1d001ef-b72b-46b4-ab41-efad0f2f2f88
        continue-on-error: true

      - name: Generate weekly social pack (Mondays only)
        if: github.event_name == 'schedule'
        run: |
          DAY=$(date -u +%u)
          if [ "$DAY" = "1" ]; then
            echo "Monday — generating social pack"
            node scripts/social-ideas.js > /dev/null
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add growth/social-pack.md
            if git diff --staged --quiet; then
              echo "No change to social pack"
            else
              git commit -m "Weekly social pack [skip ci]"
              git push
            fi
          else
            echo "Not Monday (day $DAY) — skipping social pack"
          fi
        continue-on-error: true

      - name: Build OG image
        run: |
          sudo apt-get install -y librsvg2-bin
          node scripts/build-og.js
        continue-on-error: true

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
