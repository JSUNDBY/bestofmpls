name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Refresh scraped events + horoscope every morning at 6am Central (11 UTC)
  # so the calendar and horoscope pages stay fresh without a code push.
  schedule:
    - cron: '0 11 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping queued runs in between.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Scrape events
        run: node scripts/scrape-events.js
        continue-on-error: true

      - name: Generate horoscope
        run: node scripts/build-horoscope.js

      - name: Generate today's essay
        run: node scripts/build-today.js

      - name: Build
        run: npm run build

      - name: Build OG image
        run: |
          sudo apt-get install -y librsvg2-bin
          node scripts/build-og.js
        continue-on-error: true

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
