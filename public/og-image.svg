<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Cream paper -->
  <rect x="0" y="0" width="1200" height="630" fill="#F4F2EC"/>

  <!-- Top clay bar (mirrors the right-now panel's hard 3px top rule). -->
  <rect x="0" y="0" width="1200" height="8" fill="#C8200F"/>

  <!-- Top eyebrow strip with a square clay swatch (mirrors the civic-notice
       block on the homepage). -->
  <rect x="60" y="58" width="14" height="14" fill="#C8200F"/>
  <text x="86" y="71" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-weight="700" font-size="14" letter-spacing="3.2" fill="#C8200F">AN INDEPENDENT GUIDE · MINNEAPOLIS · SAINT PAUL</text>

  <!-- Marquee headline. Two lines of compressed sans, ALL CAPS, very tight
       tracking — same treatment as the cover headline on the site. -->
  <g transform="translate(60, 220)">
    <text x="0" y="0" font-family='"Liberation Sans Narrow", "Helvetica Neue Condensed", "Arial Narrow", Impact, sans-serif' font-weight="700" font-size="190" letter-spacing="-6" fill="#141414">BEST OF MPLS</text>
    <text x="0" y="158" font-family='"Liberation Sans Narrow", "Helvetica Neue Condensed", "Arial Narrow", Impact, sans-serif' font-weight="700" font-size="190" letter-spacing="-6" fill="#141414">&amp; SAINT PAUL<tspan fill="#C8200F">.</tspan></text>
  </g>

  <!-- Subtitle (display sans, normal weight) -->
  <text x="60" y="510" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-weight="500" font-size="22" fill="#4A4A48">Where to eat, drink, hear, see, and spend a Saturday in the metro.</text>

  <!-- Right-side neighborhood-code tag rail — the site's signature
       repeatable graphic. Outlined Plex Mono codes. -->
  <g transform="translate(975, 95)">
    
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="50" height="26" fill="none" stroke="#C8200F" stroke-width="1.5"/>
      <text x="25" y="18" font-family='"Liberation Mono", "DejaVu Sans Mono", "Menlo", "Courier New", monospace' font-weight="600" font-size="14" fill="#C8200F" text-anchor="middle">NE</text>
      <text x="60" y="18" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-weight="500" font-size="13" fill="#4A4A48" letter-spacing="0.5">NORTHEAST</text>
    </g>
    <g transform="translate(0, 42)">
      <rect x="0" y="0" width="50" height="26" fill="none" stroke="#C8200F" stroke-width="1.5"/>
      <text x="25" y="18" font-family='"Liberation Mono", "DejaVu Sans Mono", "Menlo", "Courier New", monospace' font-weight="600" font-size="14" fill="#C8200F" text-anchor="middle">NL</text>
      <text x="60" y="18" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-weight="500" font-size="13" fill="#4A4A48" letter-spacing="0.5">NORTH LOOP</text>
    </g>
    <g transform="translate(0, 84)">
      <rect x="0" y="0" width="50" height="26" fill="none" stroke="#C8200F" stroke-width="1.5"/>
      <text x="25" y="18" font-family='"Liberation Mono", "DejaVu Sans Mono", "Menlo", "Courier New", monospace' font-weight="600" font-size="14" fill="#C8200F" text-anchor="middle">DT</text>
      <text x="60" y="18" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-weight="500" font-size="13" fill="#4A4A48" letter-spacing="0.5">DOWNTOWN</text>
    </g>
    <g transform="translate(0, 126)">
      <rect x="0" y="0" width="50" height="26" fill="none" stroke="#C8200F" stroke-width="1.5"/>
      <text x="25" y="18" font-family='"Liberation Mono", "DejaVu Sans Mono", "Menlo", "Courier New", monospace' font-weight="600" font-size="14" fill="#C8200F" text-anchor="middle">LH</text>
      <text x="60" y="18" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-weight="500" font-size="13" fill="#4A4A48" letter-spacing="0.5">LOWRY HILL</text>
    </g>
    <g transform="translate(0, 168)">
      <rect x="0" y="0" width="50" height="26" fill="none" stroke="#C8200F" stroke-width="1.5"/>
      <text x="25" y="18" font-family='"Liberation Mono", "DejaVu Sans Mono", "Menlo", "Courier New", monospace' font-weight="600" font-size="14" fill="#C8200F" text-anchor="middle">WB</text>
      <text x="60" y="18" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-weight="500" font-size="13" fill="#4A4A48" letter-spacing="0.5">WEST BANK</text>
    </g>
    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="60" height="26" fill="none" stroke="#C8200F" stroke-width="1.5"/>
      <text x="30" y="18" font-family='"Liberation Mono", "DejaVu Sans Mono", "Menlo", "Courier New", monospace' font-weight="600" font-size="14" fill="#C8200F" text-anchor="middle">STP</text>
      <text x="70" y="18" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-weight="500" font-size="13" fill="#4A4A48" letter-spacing="0.5">SAINT PAUL</text>
    </g>
  </g>

  <!-- Bottom rule -->
  <rect x="60" y="555" width="1080" height="2" fill="#141414"/>

  <!-- Bottom row: mono dateline + URL -->
  <text x="60" y="595" font-family='"Liberation Mono", "DejaVu Sans Mono", "Menlo", "Courier New", monospace' font-weight="500" font-size="14" fill="#878683" letter-spacing="0.5">VOL.01 · 2026 · CIVIC CULTURAL UTILITY</text>
  <text x="1140" y="595" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-weight="700" font-size="16" letter-spacing="3" fill="#C8200F" text-anchor="end">BESTOFMPLS.COM</text>
</svg>